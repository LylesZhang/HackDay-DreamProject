name: DreamJournal
options:
  bundleIdPrefix: com.hackday
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  DreamJournal:
    type: application
    platform: iOS
    sources:
      - DreamJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackday.DreamJournal
        PRODUCT_NAME: DreamJournal
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: DreamJournal/Resources/Info.plist
      properties:
        CFBundleDisplayName: 昼夜日记
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: 用于将你刚醒来时说出的梦境转写为记录。
        NSSpeechRecognitionUsageDescription: 用于将你的梦境语音转写为文字。
        CFBundleURLTypes:
          - CFBundleURLSchemes: [dreamjournal]
    dependencies:
      - target: DreamJournalWidget
        embed: true
  DreamJournalWidget:
    type: app-extension
    platform: iOS
    sources:
      - DreamJournalWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackday.DreamJournal.Widget
        PRODUCT_NAME: DreamJournalWidget
        INFOPLIST_FILE: DreamJournalWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  DreamJournal:
    build:
      targets:
        DreamJournal: all
    run:
      config: Debug
